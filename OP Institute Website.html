arn to promote businesses and brands online and reach customers through digital channels.' },\n{ cat: 'office', code: 'DA', title: 'Data Analysis', desc: 'Learn to read, organise and make sense of data to support better decisions.' },\n{ cat: 'office', code: 'Ty', title: 'Typing', desc: 'Build typing speed and accuracy, a basic skill for almost every office job.' },\n{ cat: 'office', code: 'St', title: 'Steno', desc: 'Shorthand and stenography training for office and exam-oriented roles.' },\n{ cat: 'school', code: 'CB', title: 'CBSE Board Exam Prep and Tutoring', desc: 'Tutoring and exam preparation support for CBSE board students.' }\n];\n\nconst courses = all\n.filter((c) => cat === 'all' || c.cat === cat)\n.map((c) => {\nconst p = palette[c.cat];\nreturn {\ntitle: c.title,\ndesc: c.desc,\ncode: c.code,\ntag: p.label,\ntagStyle: 'color:' + p.fg + ';background:' + p.bg,\niconStyle: 'color:' + p.fg + ';background:' + p.bg,\nhref: wa + encodeURIComponent('Hello OP Institute, I want to know about the ' + c.title + ' course.')\n};\n});\n\nconst tabDefs = [\n{ id: 'all', label: 'All courses' },\n{ id: 'basics', label: 'Basics and diplomas' },\n{ id: 'office', label: 'Office and accounts' },\n{ id: 'coding', label: 'Coding and security' },\n{ id: 'creative', label: 'Creative and marketing' },\n{ id: 'school', label: 'School' }\n];\nconst tabs = tabDefs.map((t) => ({\nlabel: t.label,\nstyle: t.id === cat\n? 'background:#22D3EE;color:#04121A;border-color:#22D3EE'\n: 'background:#0E1524;color:#E6EDF7;border-color:#2A3858',\npick: () => this.setState({ cat: t.id })\n}));\n\nconst faqDefs = [\n{ q: 'Which courses does OP Institute offer in Najafgarh?', a: 'OP Institute offers the Basic Computer Course, DCA, ADCA, Advance Excel, Tally Prime Accounting, Web Development, Full Stack Web Development, Python Programming, Data Analysis, Digital Marketing, Graphic Designing and Video Editing, Cyber Security and Ethical Hacking, Typing and Steno. CBSE board exam preparation and tutoring is also available.' },\n{ q: 'Where is OP Institute located?', a: 'OP Institute is at Rz-2 Raghubir Block, Main Paprawat Road, near Golden Valley School, Najafgarh, New Delhi - 110043. You can open our Google Maps listing from the contact section.' },\n{ q: 'Are the courses suitable for beginners?', a: 'Yes. The courses are practical and job-oriented, for beginners and professionals alike. The Basic Computer Course starts from zero.' },\n{ q: 'Does the Tally course cover GST?', a: 'Yes. The Tally Prime Accounting course covers complete financial accounting, inventory management and GST compliance.' },\n{ q: 'What are the fees and batch timings?', a: 'Fees depend on the course. Message us on WhatsApp at 80101 30667 and we will share the fees and the next batch date.' },\n{ q: 'What are the institute timings?', a: 'We are open from 7:00 AM to 8:00 PM. Call or WhatsApp 80101 30667 to confirm the batch timing that suits you.' },\n{ q: 'Do you offer video editing or data entry services?', a: 'Yes. Besides courses, OP Institute provides video editing services and data entry.' },\n{ q: 'Are online classes available?', a: 'Yes. Classes run both online and offline, so you can join from home or come to the centre in Najafgarh.' },\n{ q: 'Is there a free demo class?', a: 'Yes. We offer free demo classes so you can experience the teaching before you join. Message us on WhatsApp at 80101 30667 to book one.' }\n];\nconst faqs = faqDefs.map((f, i) => {\nconst isOpen = open === i;\nreturn {\nq: f.q,\na: f.a,\nisOpen: isOpen,\ntoggle: () => this.setState({ open: isOpen ? -1 : i }),\nplusStyle: 'font-size:28px;font-weight:500;color:#22D3EE;line-height:1;transition:transform .3s ease;transform:rotate(' + (isOpen ? 45 : 0) + 'deg)',\npanelStyle: 'display:grid;transition:grid-template-rows .35s ease;grid-template-rows:' + (isOpen ? '1fr' : '0fr')\n};\n});\n\nreturn { tabs: tabs, courses: courses, faqs: faqs };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
